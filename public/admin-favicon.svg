<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Outer neon red glow -->
    <filter id="glow-r" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur1"/>
      <feGaussianBlur stdDeviation="2.8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: near-black with very subtle red tint -->
  <rect width="32" height="32" rx="4" fill="#0f0505"/>

  <!-- Border: neon red frame -->
  <rect x="1" y="1" width="30" height="30" rx="3.5"
        fill="none" stroke="#ff0000" stroke-width="1.2" opacity="0.75"/>

  <!-- Scanline texture (every 4px) -->
  <line x1="0" y1="4"  x2="32" y2="4"  stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="8"  x2="32" y2="8"  stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="12" x2="32" y2="12" stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="20" x2="32" y2="20" stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="24" x2="32" y2="24" stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="28" x2="32" y2="28" stroke="#ff0000" stroke-width="0.3" opacity="0.08"/>

  <!-- 'A' glyph / Warning triangle — bold lines, glowing red -->
  <path
    d="M16 6 L26 26 L6 26 Z M11 18 L21 18"
    fill="none"
    stroke="#ff0000"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow-r)"
  />
</svg>
